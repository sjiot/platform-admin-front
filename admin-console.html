<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  body{margin:0}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
</head>
<body>
<title>딸깍 키링 관제 콘솔</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* 단일 라이트 테마 — 기존 Admin Console 팔레트 그대로 */
:root{
  color-scheme:light;
  --ground:#eceff4; --surface:#ffffff; --surface-2:#f7f9fc; --surface-3:#fbfcfe;
  --line:#dfe4ec; --line-2:#e6eaf1; --line-soft:#f0f2f7; --line-hair:#eef1f6;
  --ink:#1b2130; --navy:#16233c; --slate:#46506b; --muted:#6b7488; --faint:#98a2b5; --faint-2:#8b94a7;
  --primary:#2f6df6; --primary-soft:#e8f0ff; --primary-ink:#2f5fd0; --ring:rgba(47,109,246,.42);
  --danger:#d9463a; --danger-ink:#b03a2b; --danger-deep:#a5301f; --danger-soft:#fdf5f3; --danger-soft-2:#fef4f3;
  --danger-line:#e8a79c; --danger-line-2:#f6cfc9; --danger-btn-line:#f0b6ae; --danger-btn-fg:#c0392b;
  --warn:#e79a2b; --warn-ink:#9a6412; --warn-soft:#fff4e2; --warn-line:#f0d9ad;
  --ok:#3ba268; --ok-ink:#1f7a4d; --ok-soft:#e8f6ed;
  --rail:#c3ccdb; --rail-body:#f2f5fa;
  --cap-r:#e0443a; --cap-y:#f1c33c; --cap-g:#3ba268; --cap-b:#3b76e8;
  --sans:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}
#app{display:flex;flex-direction:column;height:100%;min-height:0}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#cfd6e2;border-radius:6px;border:3px solid transparent;background-clip:content-box}

/* ---------- shell ---------- */
header.bar{flex:none;min-height:52px;background:var(--navy);color:#fff;display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:8px 18px}
.brand{display:flex;align-items:center;gap:9px}
.brand .mark{width:22px;height:22px;border-radius:5px;background:var(--primary);display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff}
.brand .name{font-weight:600;letter-spacing:.09em;font-size:12.5px}
.vr{width:1px;height:18px;background:rgba(255,255,255,.18)}
.sub{font-size:12px;color:#9fb0cc}
.spacer{flex:1}
.chip-alert{display:flex;align-items:center;gap:6px;background:rgba(232,68,58,.16);border:1px solid rgba(232,68,58,.45);color:#ff9d95;padding:5px 10px;border-radius:6px;font-size:11.5px;font-weight:500;white-space:nowrap}
.chip-alert.solid{background:rgba(217,70,58,.9);border-color:transparent;color:#fff;font-weight:600}
.dot{width:6px;height:6px;border-radius:50%;background:#ff6b5e;animation:pulse 1.6s infinite;flex:none}
.btn-agv{cursor:pointer;height:30px;padding:0 13px;border-radius:6px;font-size:11.5px;font-weight:700;letter-spacing:.02em;display:flex;align-items:center;gap:7px;white-space:nowrap}
.clock{font-family:var(--mono);font-size:12px;color:#c6d3e6}
nav.tabs{flex:none;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:stretch;padding:0 18px;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{border:none;background:none;cursor:pointer;padding:0 15px;min-height:44px;display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent}
.tab[aria-selected="true"]{color:var(--navy);font-weight:600;border-bottom-color:var(--primary)}
.tab .pill{font-family:var(--mono);font-size:11px;background:#f2f4f8;color:var(--faint-2);padding:1px 6px;border-radius:9px}
.tab[aria-selected="true"] .pill{background:var(--primary-soft);color:var(--primary-ink)}
.banner{flex:none;background:var(--danger);color:#fff;padding:9px 18px;display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:600}
.body{flex:1;min-height:0;display:flex;align-items:stretch}
main{flex:1;min-width:0;overflow-y:auto;padding:18px 18px 36px}
.wrap{display:flex;flex-direction:column;gap:14px}
.wrap.narrow{max-width:1000px}
.wrap.doc{max-width:760px}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:9px}
.sechead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sechead h2{margin:0;font-size:14px;font-weight:600}
.sechead .note{font-size:12px;color:var(--muted)}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--faint);text-transform:uppercase}
.alert{border-radius:9px;padding:13px 15px;display:flex;flex-direction:column;gap:7px;background:var(--danger-soft-2);border:1px solid var(--danger-line-2)}
.alert .t{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--danger-ink)}
.alert.warn{background:var(--warn-soft);border-color:var(--warn-line)}
.alert.warn .t{color:var(--warn-ink)}
.alert.good{background:var(--ok-soft);border-color:#bfe3cd}
.alert.good .t{color:var(--ok-ink)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{background:var(--surface);border:1px solid #f0d3ce;border-radius:6px;padding:4px 9px;font-size:11.5px;color:#7d4237}
.tag.n{border-color:var(--line);color:var(--muted)}
.btn{cursor:pointer;height:32px;padding:0 13px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--slate);font-size:12.5px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn.primary{border-color:transparent;background:var(--primary);color:#fff;font-weight:600}
.btn.primary:hover{color:#fff;filter:brightness(1.07)}
.btn.danger{border-color:transparent;background:var(--danger);color:#fff;font-weight:600}
.btn.danger:hover{color:#fff;filter:brightness(1.07)}
.btn.ghostdanger{border-color:var(--danger-btn-line);color:var(--danger-btn-fg)}
.btn.ghostdanger:hover{border-color:var(--danger);color:var(--danger)}
.btn.sm{height:28px;padding:0 11px;font-size:11.5px}
.meter{height:5px;border-radius:3px;background:var(--line-hair);overflow:hidden}
.meter>i{display:block;height:100%;background:var(--ok)}

/* ---------- 창고 도면 ---------- */
.mapbox{padding:16px;overflow-x:auto}
.map{min-width:660px;display:flex;flex-direction:column;gap:14px}
.maplane{border:1px dashed var(--line);border-radius:9px;padding:13px;display:flex;flex-direction:column;gap:11px;background:var(--surface-3)}
.lanetag{display:flex;align-items:center;gap:8px}
.lanetag b{font-size:12px;font-weight:600;color:var(--muted)}
.lanetag span{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.gridA{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.gridB{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:10px;align-items:center}
.part{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 11px;cursor:pointer;display:flex;flex-direction:column;gap:7px;text-align:left;width:100%;transition:border-color .12s,background .12s}
.part:hover{border-color:var(--primary)}
.part .ptop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.part .pid{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.part .pname{font-size:12.5px;font-weight:600;color:var(--navy)}
.part .pstat{font-size:11px;color:var(--ok-ink);background:var(--ok-soft);border-radius:5px;padding:2px 7px;white-space:nowrap}
.part.bad{border-color:var(--danger-line);background:var(--danger-soft)}
.part.bad .pname{color:var(--danger-deep)}
.part.bad .pstat{color:#fff;background:var(--danger);font-weight:600}
.part.belt{padding:8px 11px}
.beltline{position:relative;height:16px;border-radius:5px;background:var(--rail-body);border:1px solid var(--line-hair);overflow:hidden}
.beltline::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,var(--rail) 0 3px,transparent 3px 11px);opacity:.75}
.part.bad .beltline{background:var(--surface);border-color:var(--danger-line)}
.part.bad .beltline::after{background:repeating-linear-gradient(115deg,var(--danger) 0 3px,transparent 3px 11px);opacity:.85}
.arm{width:118px}
.armglyph{height:34px;border-radius:8px;border:1px solid var(--line-hair);background:var(--rail-body);display:grid;place-items:center;font-family:var(--mono);font-size:11px;color:var(--muted)}
.part.bad .armglyph{background:var(--surface);border-color:var(--danger-line);color:var(--danger-ink)}
.pips{display:flex;flex-direction:column;gap:4px}
.piprow{display:flex;align-items:center;gap:4px}
.piprow .lt{font-family:var(--mono);font-size:10.5px;width:11px;color:var(--muted);font-weight:600}
.pip{width:15px;height:15px;border-radius:4px;border:1px solid rgba(0,0,0,.12)}
.pip.out{outline:2px solid var(--danger);outline-offset:1px}
.pip.low{outline:2px solid var(--warn);outline-offset:1px}
.bay{min-width:104px}
.bayglyph{height:34px;border-radius:8px;border:1px dashed var(--line);display:grid;place-items:center;font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.part.bad .bayglyph{border-color:var(--danger-line);border-style:solid;color:var(--danger-ink)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:11.5px;color:var(--muted);align-items:center}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:-1px}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes locatePulse{from{box-shadow:0 0 0 0 var(--ring)}to{box-shadow:0 0 0 9px transparent}}
@keyframes toastin{from{transform:translate(-50%,10px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@keyframes slidein{from{transform:translateX(18px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.is-locating{animation:locatePulse .5s ease-out 3;border-color:var(--primary)!important}
tr.is-locating td{background:var(--primary-soft)}
@media (prefers-reduced-motion:reduce){.is-locating{animation:none;box-shadow:0 0 0 3px var(--ring)}.dot{animation:none}}

/* ---------- tables ---------- */
.tablebox{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:760px}
th{text-align:left;font-size:11.5px;font-weight:500;color:var(--muted);background:var(--surface-2);border-bottom:1px solid var(--line-2);padding:10px 14px;white-space:nowrap}
td{border-bottom:1px solid var(--line-soft);padding:10px 14px;font-size:12.5px;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tr.rowlink{cursor:pointer}
tr.rowlink:hover td{background:var(--surface-2)}
tr.sel td{background:#fafbfe}
tr.open td{background:#f4f8ff}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:5px;font-size:11.5px;font-weight:500;white-space:nowrap;background:#fdecea;color:var(--danger-ink)}
.badge.n{background:var(--surface-2);color:var(--muted)}
.actor{display:inline-block;padding:2px 8px;border-radius:5px;font-size:11px;font-family:var(--mono);white-space:nowrap;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.actor.agv{background:var(--primary-soft);color:var(--primary-ink);border-color:transparent}
.actor.plat{background:var(--warn-soft);color:var(--warn-ink);border-color:var(--warn-line)}
.empty{padding:34px;text-align:center;color:var(--faint);font-size:12.5px}
.captile{width:22px;height:22px;border-radius:5px;display:grid;place-items:center;font-size:10.5px;font-weight:700;font-family:var(--mono);border:1px solid rgba(0,0,0,.09)}
.sw{border-radius:4px;border:1px solid rgba(0,0,0,.11);flex:none}

/* ---------- 창고 재고 ---------- */
.zonegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:820px){.zonegrid{grid-template-columns:minmax(0,1fr)}}
.zonecard{display:flex;flex-direction:column}
.zonehead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 13px;border-bottom:1px solid var(--line-soft);background:var(--surface-2);border-radius:9px 9px 0 0}
.zonehead .z{font-size:12.5px;font-weight:600;color:var(--navy)}
.zonehead .l{font-family:var(--mono);font-size:12px;color:var(--primary-ink);background:var(--primary-soft);border-radius:5px;padding:1px 7px}
.zonehead .b{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-left:auto}
.cartgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line-soft);border-radius:0 0 9px 9px;overflow:hidden}
@media (max-width:480px){.cartgrid{grid-template-columns:repeat(2,1fr)}}
.cart{background:var(--surface);border:none;cursor:pointer;padding:9px 8px;display:flex;flex-direction:column;gap:6px;text-align:left;font:inherit}
.cart:hover{background:var(--surface-2)}
.cart .cid{display:flex;align-items:center;gap:5px}
.cart .cname{font-family:var(--mono);font-size:11px;color:var(--muted)}
.cart .cqty{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--navy);letter-spacing:-.02em}
.cart .cqty s{text-decoration:none;font-size:10.5px;font-weight:400;color:var(--faint)}
.cart.low .cqty{color:var(--warn-ink)} .cart.low .meter>i{background:var(--warn)}
.cart.out{background:var(--danger-soft)} .cart.out .cqty{color:var(--danger-btn-fg)} .cart.out .meter>i{background:var(--danger)}
.rack{display:flex;flex-direction:column;padding:4px 14px 10px}
.boardrow{display:grid;grid-template-columns:22px 1fr 68px 96px;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line-soft)}
.rack .boardrow:first-child{border-top:none}
@media (max-width:480px){.boardrow{grid-template-columns:22px 1fr 60px;row-gap:6px}.boardrow .btn{grid-column:2/-1;justify-self:start}}
.logrow{display:flex;gap:12px;font-size:12px;color:var(--slate);padding:7px 0;border-bottom:1px solid var(--line-soft)}
.logrow:last-child{border-bottom:none}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:0 10px;height:32px}
.field input,.field select{border:none;outline:none;background:none;font-size:12.5px;min-width:0}
.field select{cursor:pointer}
.chipbtn{cursor:pointer;height:32px;padding:0 12px;border-radius:7px;font-size:12.5px;border:1px solid var(--line);background:var(--surface);color:var(--slate)}
.chipbtn[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:500}

/* ---------- 조립대 / 용지 ---------- */
.cards3{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,320px));gap:14px}
.stcard{padding:16px;display:flex;flex-direction:column;gap:14px}
.stcard.help{background:#fdf5f3;border-color:var(--danger-line)}
.big{font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:-.01em}
.helpbox{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid #f0c9c2;border-radius:8px;padding:11px 12px}

/* ---------- 상세 패널 ---------- */
aside.detail{width:336px;flex:none;background:var(--surface);border-left:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:16px;animation:slidein .18s ease-out;overflow-y:auto}
aside.detail .dl{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;gap:10px}
aside.detail .dl>span:first-child{color:var(--muted)}
.steplist{display:flex;flex-direction:column;gap:5px}
.step{min-height:32px;padding:0 10px;border-radius:7px;font-size:12px;font-weight:500;display:flex;align-items:center;gap:8px;border:1px solid var(--line-hair);background:var(--surface-3);color:var(--faint);text-align:left;user-select:none}
.step .code{font-family:var(--mono);font-size:10px;opacity:.6}
.step.on{background:var(--navy);border-color:var(--navy);color:#fff}
.ro{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--slate)}
.ro em{font-style:normal;font-weight:400;font-size:10.5px;letter-spacing:.04em;color:var(--faint);background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
/* 단계 표시 — 구간 칩 + 단계명 */
.stagecell{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.phasechip{display:inline-flex;align-items:center;padding:2px 7px;border-radius:5px;font-size:10.5px;font-weight:600;white-space:nowrap}
.stagename{font-size:12px;color:var(--ink)}
.stagename.abn{color:var(--danger-ink);font-weight:600}
.stagename.abn::before{content:"⚠ ";font-size:10px}
/* 상세 패널 사다리 — 구간별 접기 */
.ladder{display:flex;flex-direction:column;gap:6px}
.phase{border:1px solid var(--line-hair);border-radius:8px;background:var(--surface-3);overflow:hidden}
.phase.cur{border-color:var(--line);background:var(--surface)}
.phase.cur.abn{border-color:var(--danger-line);background:var(--danger-soft)}
.phasehead{display:flex;align-items:center;gap:8px;padding:9px 10px;width:100%;border:none;background:none;font:inherit;text-align:left;cursor:pointer}
.phasehead .mk{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:9.5px;line-height:1;flex:none;background:var(--line-hair);color:var(--faint)}
.phasehead .mk.done{background:var(--ok-soft);color:var(--ok-ink)}
.phasehead .mk.cur{background:var(--navy);color:#fff}
.phasehead .mk.cur.abn{background:var(--danger);color:#fff}
.phasehead .nm{font-size:12px;font-weight:600;color:var(--muted)}
.phase.cur .phasehead .nm{color:var(--navy)}
.phasehead .ct{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.phasebody{display:flex;flex-direction:column;gap:3px;padding:0 10px 10px}
.st{display:flex;align-items:center;gap:8px;min-height:28px;padding:0 9px;border-radius:6px;font-size:11.5px;color:var(--faint);border:1px solid transparent}
.st .c{font-family:var(--mono);font-size:9.5px;opacity:.7}
.st.done{color:var(--slate);background:var(--surface-2)}
.st.now{background:var(--navy);color:#fff;font-weight:600}
.st.now .c{opacity:.75}
.st.now.abn{background:var(--danger)}
.st.abn:not(.now){color:var(--danger-ink);border-color:var(--danger-line);border-style:dashed}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid4{display:flex;gap:6px}
.grid4 .step{flex:1;justify-content:center;font-family:var(--mono)}
@media (max-width:900px){
  .body{flex-direction:column}
  aside.detail{width:auto;border-left:none;border-top:1px solid var(--line);animation:none}
}

/* ---------- doc ---------- */
.doc h2{margin:26px 0 0;font-size:17px;font-weight:600;letter-spacing:-.015em;text-wrap:balance}
.doc h2:first-child{margin-top:0}
.doc h3{margin:18px 0 0;font-size:13.5px;font-weight:600;color:var(--navy)}
.doc p{margin:9px 0 0;font-size:13.5px;line-height:1.75;max-width:68ch}
.doc ul{margin:9px 0 0;padding-left:19px;display:flex;flex-direction:column;gap:6px}
.doc li{font-size:13.5px;line-height:1.7}
.doc code{font-family:var(--mono);font-size:12px;background:var(--surface-2);border:1px solid var(--line-hair);border-radius:4px;padding:1px 5px}
.doc pre{margin:11px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:13px 14px;overflow-x:auto}
.doc pre code{background:none;border:none;padding:0;font-size:12px;line-height:1.65;display:block;white-space:pre}
.doc hr{border:none;border-top:1px solid var(--line);margin:26px 0 0}
.lede{font-size:14px;color:var(--muted);line-height:1.7;max-width:64ch}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:11px}

<script>
(function(){
"use strict";

/* ===================== API ===================== */
/* 접속 주소: 기본은 배포 서버. 로컬은 ?api=http://127.0.0.1:5000 */
var API_BASE = (function(){
  try {
    var q = new URLSearchParams(location.search).get('api');
    if(q) return q.replace(/\/+$/, '');
  } catch(e) {}
  return 'https://charry-erminia-revelational.ngrok-free.dev';
})();
var ADMIN_PW = null;   /* 비밀번호가 필요한 동작에서만 묻고 메모리에만 둔다 */

async function api(method, path, body){
  var res;
  try {
    res = await fetch(API_BASE + path, {
      method: method,
      headers: Object.assign({'ngrok-skip-browser-warning': 'true'},
                             body ? {'Content-Type': 'application/json'} : {}),
      body: body ? JSON.stringify(body) : undefined
    });
  } catch(e) {
    var ne = new Error('서버에 연결할 수 없습니다'); ne.status = 0; throw ne;
  }
  var data = null;
  try { data = await res.json(); } catch(e) {}
  if(!res.ok){
    if(res.status === 400 && data && data.error === '비밀번호가 틀렸습니다') ADMIN_PW = null;
    var err = new Error((data && data.error) || ('HTTP ' + res.status));
    err.status = res.status; err.data = data;
    throw err;
  }
  return data;
}

/* ===================== 상수 ===================== */
var LOW_AT = 6;                         /* 이 개수 이하면 부족 */
var KEYCAP_MAX_FALLBACK = 40, BOARD_MAX_FALLBACK = 3;
var CNAME = {r:'레드', y:'옐로', g:'그린', b:'블루'};
var CHEX  = {r:'#e0443a', y:'#f1c33c', g:'#3ba268', b:'#3b76e8'};
var CFG   = {r:'#fff', y:'#4a3a05', g:'#fff', b:'#fff'};
var COLORS = ['r','y','g','b'];
var BOARD_CODE = {red:'r', yellow:'y', green:'g', blue:'b'};

var STATUS = {
  대기중:['#eef1f6','#5b6478'], 호출중:['#fff4e2','#b06a12'], 조립중:['#e8f0ff','#2f5fd0'],
  조립완료:['#e8f6ed','#1f7a4d'], 미수령:['#fdecea','#b03a2b'], 종료:['#f2f4f8','#6b7488']
};
var ORDER_STATUSES = ['대기중','호출중','조립중','조립완료','미수령','종료'];
var PHASES = [
  {id:'intake',    name:'접수',      bg:'#eef1f6', fg:'#5b6478'},
  {id:'warehouse', name:'창고 출고', bg:'#f4eefe', fg:'#6d4bd0'},
  {id:'agv',       name:'AGV 배송',  bg:'#e8f0ff', fg:'#2f5fd0'},
  {id:'station',   name:'조립대',    bg:'#e8f6ed', fg:'#1f7a4d'}
];
var PHASE_MAP = {}; PHASES.forEach(function(p){ PHASE_MAP[p.id] = p; });
/* config.STAGE_ORDER 와 이름·순서가 같다 */
var STAGES = [
  ['queued',            '대기열',      'intake'],
  ['assigned',          '출고 지시',   'intake'],
  ['keycap_mismatched', '키캡 불일치', 'warehouse', true],
  ['keycap_dispensed',  '키캡 배출',   'warehouse'],
  ['keycap_reached',    '키캡 이송',   'warehouse'],
  ['keycap_packed',     '키캡 적재',   'warehouse'],
  ['tray_reached',      '트레이 이송', 'warehouse'],
  ['board_mismatched',  '보드 불일치', 'warehouse', true],
  ['board_packed',      '보드 적재',   'warehouse'],
  ['pickup_reached',    '출고 대기',   'warehouse'],
  ['loaded',            'AGV 적재',    'agv'],
  ['arrived',           '조립대 도착', 'agv'],
  ['unclaimed',         '미수령',      'station', true],
  ['verified',          '사용자 인증', 'station'],
  ['received',          '부품 수령',   'station'],
  ['completed',         '주문 완료',   'station']
];
var STAGE_MAP = {}, STAGE_IDX = {};
STAGES.forEach(function(t, i){ STAGE_MAP[t[0]] = t; STAGE_IDX[t[0]] = i; });
var WAREHOUSE_STAGES = ['assigned','keycap_mismatched','keycap_dispensed','keycap_reached','keycap_packed','tray_reached','board_mismatched','board_packed'];
function stageOf(code){ return STAGE_MAP[code] || null; }
function stageLabel(code){ var s = stageOf(code); return s ? s[1] : (code || '-'); }

/* 키캡 선반 = 구역. 선반 번호는 config.MBTI_AXES 순서 (E/I · S/N · T/F · J/P) */
var ZONES = [
  {id:'zone1', no:1, shelf:'keycap1', letters:['E','I'], belt:'keycap_01_belt'},
  {id:'zone2', no:2, shelf:'keycap2', letters:['N','S'], belt:'keycap_01_belt'},
  {id:'zone3', no:3, shelf:'keycap3', letters:['T','F'], belt:'keycap_02_belt'},
  {id:'zone4', no:4, shelf:'keycap4', letters:['P','J'], belt:'keycap_02_belt'}
];
var SHELF_ZONE = {};
ZONES.forEach(function(z){ SHELF_ZONE[z.shelf] = z.id; });

var PARTS = {
  zone1:{name:'구역 1 카트리지'}, zone2:{name:'구역 2 카트리지'},
  zone3:{name:'구역 3 카트리지'}, zone4:{name:'구역 4 카트리지'},
  keycap_01_belt:{name:'키캡 컨베이어 1'}, keycap_02_belt:{name:'키캡 컨베이어 2'},
  keycap_arm:{name:'키캡 로봇암'}, board_rack:{name:'보드 랙'}, board_arm:{name:'보드 로봇암'},
  tray_arm:{name:'트레이 로봇암'}, tray_01_belt:{name:'트레이 컨베이어 1'}, tray_02_belt:{name:'트레이 컨베이어 2'},
  agv_bay:{name:'AGV 대기 장소'}, platform:{name:'플랫폼 감지'}
};

/* fault 카탈로그 — 백엔드가 세우는 17값 기준 (fault_정리 3장). 파트는 fault_section 으로 정한다 */
var FAULTS = {
  keycap_01_belt_jammed:  {g:'컨베이어', sec:'keycap_conveyor:01', actor:'창고',     label:'벨트 걸림',        fix:'구역 1·2 벨트 구간 잔류물 정리'},
  keycap_02_belt_jammed:  {g:'컨베이어', sec:'keycap_conveyor:02', actor:'창고',     label:'벨트 걸림',        fix:'구역 3·4 벨트 구간 잔류물 정리'},
  tray_01_belt_jammed:    {g:'컨베이어', sec:'tray_conveyor:01',   actor:'창고',     label:'벨트 걸림',        fix:'트레이 벨트 앞 구간 정리'},
  tray_02_belt_jammed:    {g:'컨베이어', sec:'tray_conveyor:02',   actor:'창고',     label:'벨트 걸림',        fix:'트레이 벨트 뒤 구간 정리'},
  keycap_cartridge_failed:{g:'카트리지', sec:'keycap_cartridge:{선반}:{칸}', actor:'창고', label:'카트리지 고장', fix:'카트리지 재장착 후 배출 테스트'},
  keycap_driver_failed:   {g:'카트리지', sec:'keycap_cartridge:{선반}', actor:'창고',  label:'드라이버 고장',    fix:'드라이버 리셋 · 교체 (선반 8칸 전체)'},
  board_cartridge_failed: {g:'카트리지', sec:'board_cartridge:{칸}', actor:'창고',     label:'보드 재출고 초과', fix:'보드 보관대 확인 후 재출고'},
  keycap_pack_failed:     {g:'로봇암',   sec:'keycap_robot_arm:{keycapN}', actor:'창고', label:'키캡 투입 실패', fix:'트레이 위치 정렬 후 재투입'},
  board_pack_failed:      {g:'로봇암',   sec:'board_robot_arm',    actor:'창고',     label:'보드 투입 실패',   fix:'보드 파지 재시도'},
  tray_load_failed:       {g:'로봇암',   sec:'tray_robot_arm',     actor:'창고',     label:'트레이 투입 실패', fix:'빈 트레이 재투입'},
  pickup_failed:          {g:'AGV',      sec:'agv',                actor:'agv',      label:'픽업 실패',        fix:'AGV 재접근 · 픽업 재시도'},
  drop_failed:            {g:'AGV',      sec:'agv · agv:station{N}', actor:'agv',    label:'하차 실패 · 오배송', fix:'조립대 하차 위치 재정렬 / 제 조립대로 재도착'},
  agv_broken:             {g:'AGV',      sec:'agv',                actor:'agv',      label:'AGV 자체 고장',    fix:'사람 개입 필요 · 수동 견인 후 부팅'},
  keycap_empty:           {g:'재고',     sec:'keycap_cartridge:{선반}:{칸}', actor:'창고', label:'키캡 재고 소진', fix:'카트리지 교체(재고 채우기) 후 fault 해제'},
  board_empty:            {g:'재고',     sec:'board_cartridge:{칸}', actor:'창고',     label:'보드 재고 소진',   fix:'보드 보충(재고 채우기) 후 fault 해제'},
  stage_timeout:          {g:'플랫폼',   sec:'그 단계 설비',        actor:'플랫폼',   label:'단계 체류 초과',   fix:'끊긴 동작 재수행 후 fault 해제'},
  restart_unknown:        {g:'플랫폼',   sec:'keycap_cartridge',   actor:'플랫폼',   label:'재기동 진행 불명', fix:'창고 진행분 확인 후 fault 해제'}
};
function faultDef(code){ return FAULTS[code] || {g:'기타', sec:'-', actor:'플랫폼', label:code || '알 수 없음', fix:'로그 확인'}; }

/* ===================== 상태 ===================== */
var S = {
  tab:'orders',
  orders:[], stations:[], calls:{}, stock:{}, stockMax:{}, board:{}, boardMax:{}, faults:[], line:null,
  loaded:{}, err:{},
  printer:{name:'키오스크', qty:900, cap:900, lastAt:'-'},   /* 백엔드 미연동 — 이 브라우저에만 있는 값 */
  log:[], paperLog:[],
  query:'', filter:'전체', sel:[], detailId:null, detailEnter:false, receiptId:null,
  dialog:null,
  reset:{mode:'zero', keep_queue:false, confirm:''}, resetResult:null,
  snap:null, snapBusy:false, snapMobius:false
};

/* ===================== 유틸 ===================== */
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function p2(n){ return String(n).padStart(2,'0'); }
function now(){ var d = new Date(); return p2(d.getHours()) + ':' + p2(d.getMinutes()); }
function hhmm(iso){ return iso && iso.length >= 16 ? iso.slice(11, 16) : '-'; }
function fmtSec(s){ if(s == null) return '-'; s = Math.max(0, Math.round(s)); return s < 60 ? s + '초' : Math.floor(s / 60) + '분 ' + (s % 60) + '초'; }
function stNo(sid){ return p2(sid); }
function lowCarts(){ return Object.keys(S.stock).filter(function(k){ return S.stock[k] > 0 && S.stock[k] <= LOW_AT; }); }
function outCarts(){ return Object.keys(S.stock).filter(function(k){ return S.stock[k] === 0; }); }
function keyMax(k){ return S.stockMax[k] || KEYCAP_MAX_FALLBACK; }
function boardMax(c){ return S.boardMax[c] || BOARD_MAX_FALLBACK; }
function boardTotal(){ return COLORS.reduce(function(a, c){ return a + (S.board[c] || 0); }, 0); }
function boardCap(){ return COLORS.reduce(function(a, c){ return a + boardMax(c); }, 0); }
function paperLow(){ return S.printer.qty === 0 || S.printer.qty / S.printer.cap <= 0.12; }
function callCount(){ return Object.keys(S.calls).length; }

/* fault_section(part[:scope[:slot]]) → 도면 파트 */
function partOf(f){
  if(f.code === 'stage_timeout' || f.code === 'restart_unknown') return 'platform';
  var p = (f.section || '').split(':');
  switch(p[0]){
    case 'keycap_cartridge': return SHELF_ZONE[p[1]] || 'platform';
    case 'board_cartridge':  return 'board_rack';
    case 'keycap_conveyor':  return p[1] === '02' ? 'keycap_02_belt' : 'keycap_01_belt';
    case 'tray_conveyor':    return p[1] === '02' ? 'tray_02_belt' : 'tray_01_belt';
    case 'keycap_robot_arm': return 'keycap_arm';
    case 'board_robot_arm':  return 'board_arm';
    case 'tray_robot_arm':   return 'tray_arm';
    case 'agv':              return 'agv_bay';
  }
  return 'platform';
}
function faultsOf(pid){ return S.faults.filter(function(f){ return partOf(f) === pid; }); }
function actorClass(a){ return a === 'agv' ? 'agv' : (a === '플랫폼' ? 'plat' : ''); }
function say(msg){
  var el = document.getElementById('toast');
  el.innerHTML = '<div class="toast">' + esc(msg) + '</div>';
  clearTimeout(say._t);

/* 사용자상태 — 백엔드에 없는 값이라 stage 에서 파생한다 */
function userStatus(o){
  if(o.ended_at && o.reason) return '종료';
  switch(o.stage){
    case 'loaded': case 'arrived':    return '호출중';
    case 'verified': case 'received': return '조립중';
    case 'completed':                 return '조립완료';
    case 'unclaimed':                 return '미수령';
    default:                          return '대기중';
  }
}
function stationStatus(occ, o){
  if(occ === 'idle' || !o) return '배정 대기 중';
  if(o.stage === 'unclaimed') return '폐기 대기';
  var u = userStatus(o);
  return {호출중:'호출 중', 조립중:'조립 중', 조립완료:'조립 완료'}[u] || '부품 준비 중';
}

/* ===================== 데이터 로더 ===================== */
async function loadOrders(){
  var d = await api('GET', '/admin/orders');
  var seen = {};
  var list = (d.orders || []).filter(function(o){        /* 노쇼 폐기 대기 주문은 진행 중·아카이브에 둘 다 나온다 — 앞(진행 중)을 남긴다 */
    if(seen[o.order_id]) return false;
    seen[o.order_id] = true; return true;
  }).map(function(o){
    return {
      orderNo: o.order_id,
      seq: o.order_seq,
      waitNo: o.order_seq != null ? String(o.order_seq) : '-',
      mbti: o.keycap || '',
      caps: o.colors || [],
      boardColor: BOARD_CODE[o.board] || o.board,
      sid: o.station_id ? String(o.station_id) : null,
      station: o.station_id ? stNo(o.station_id) : '배정 중',
      stage: o.stage,
      status: userStatus(o),
      fault: o.fault || null,
      ended: !!o.ended_at,
      endedAt: o.ended_at || null,
      reason: o.reason || null,
      createdAt: o.created_at || null
    };
  });
  list.sort(function(a, b){
    if(a.ended !== b.ended) return a.ended ? 1 : -1;               /* 진행 중 먼저 */
    return a.ended ? (b.seq || 0) - (a.seq || 0) : (a.seq || 0) - (b.seq || 0);
  });
  S.orders = list;
  var ids = list.map(function(o){ return o.orderNo; });
  S.sel = S.sel.filter(function(id){ return ids.indexOf(id) >= 0; });
}
async function loadStations(){
  var d = await api('GET', '/admin/stations');
  S.stations = (d.stations || []).map(function(s){
    return {sid:String(s.station_id), no:stNo(s.station_id), occupancy:s.occupancy, order:s.order || null};
  });
}
async function loadCalls(){
  var d = await api('GET', '/admin/calls');
  var m = {};
  (d.calls || []).forEach(function(c){ m[String(c.station_id)] = c; });
  S.calls = m;
}
async function loadStock(){
  var d;
  try { d = await api('GET', '/admin/stock'); }
  catch(e){
    if(e.status === 503){ S.stock = {}; S.board = {}; throw new Error('재고 정보가 아직 없습니다 (부팅 직후 시드 전)'); }
    throw e;
  }
  var st = {}, mx = {}, bd = {}, bm = {};
  Object.keys(d.keycap || {}).forEach(function(l){
    Object.keys(d.keycap[l]).forEach(function(c){
      st[l + '_' + c] = d.keycap[l][c].qty;
      mx[l + '_' + c] = d.keycap[l][c].max;
    });
  });
  Object.keys(d.board || {}).forEach(function(c){ bd[c] = d.board[c].qty; bm[c] = d.board[c].max; });
  S.stock = st; S.stockMax = mx; S.board = bd; S.boardMax = bm;
}
async function loadFaults(){
  var d = await api('GET', '/admin/faults');
  S.faults = (d.faults || []).map(function(x){
    var p = (x.fault_section || '').split(':');
    return {
      id: x.order_id,
      code: x.fault,
      section: x.fault_section || '',
      target: x.fault === 'stage_timeout' ? (x.fault_section || '') : (p[2] || p[1] || ''),
      seq: x.order_seq,
      wait: x.order_seq != null ? String(x.order_seq) : '-',
      stage: x.stage,
      sid: x.station_id || null
    };
  });
}

/* 갱신 간격. 서버는 sync 워커 1개이고 요청마다 Redis 명령이 여러 개 나간다 (orders 10 · line 8 · faults 9 · stations 7 · calls 5 · stock 1).
   보는 탭만 10초, 헤더(호출·영업 상태·재고)는 30초, 전체는 60초. 탭이 숨겨져 있으면 쉰다. */
var POLL_TAB_MS = 10000, POLL_HEADER_MS = 30000, POLL_ALL_MS = 60000;
var lastHeaderAt = 0, lastAllAt = 0, lastAnyAt = 0;

/* level 0 = 보는 탭만 · 1 = 탭 + 헤더 · 2 = 전부 */
async function refresh(level){
  if(refreshing) return;
  refreshing = true;
  var now0 = Date.now();
  lastAnyAt = now0;
  if(level >= 1) lastHeaderAt = now0;
  if(level >= 2) lastAllAt = now0;
  var names = level >= 2 ? Object.keys(SOURCES) : (TAB_SOURCES[S.tab] || []).concat(level >= 1 ? HEADER_SOURCES : []);
  names = names.filter(function(n, i){ return names.indexOf(n) === i; });
  await Promise.all(names.map(async function(n){
    try { await SOURCES[n](); S.err[n] = null; }
    catch(e){ S.err[n] = e.message; }
    S.loaded[n] = true;
  }));
  refreshing = false;
  renderHeader(); renderMain();          /* 확인 창은 다시 그리지 않는다 — 입력 중인 비밀번호가 지워진다 */
}

function viewDetail(){
  var d = S.orders.filter(function(o){ return o.orderNo === S.detailId; })[0];

  var step = function(label, on){ return '<div class="step' + (on ? ' on' : '') + '">' + label + '</div>'; };
  var ladder = function(d){
    var cur = stageOf(d.stage);
    if(!cur) return '<div class="muted" style="font-size:12px">알 수 없는 단계: ' + esc(d.stage) + '</div>';
    var idx = STAGE_IDX[d.stage], curPhase = cur[2], curAbn = !!cur[3];
    var open = curPhase;                       /* 현재 구간만 펼친 고정 표시 — 클릭으로 접고 펴지 않는다 */
    return '<div class="ladder">' + PHASES.map(function(p){
      var list = STAGES.filter(function(s){ return s[2] === p.id; });
      var maxIdx = STAGE_IDX[list[list.length - 1][0]];
      var isCur = p.id === curPhase, isDone = !isCur && maxIdx < idx;
      var normals = list.filter(function(s){ return !s[3]; });
      var reached = normals.filter(function(s){ return STAGE_IDX[s[0]] <= idx; }).length;
      var mk = isDone ? '<span class="mk done">✓</span>'
             : isCur ? '<span class="mk cur' + (curAbn ? ' abn' : '') + '">●</span>'
             : '<span class="mk">○</span>';
      var body = open === p.id
        ? '<div class="phasebody">' + list.map(function(s){
            var i = STAGE_IDX[s[0]];
            var cls = s[3] ? (i === idx ? 'now abn' : 'abn') : (i === idx ? 'now' : (i < idx ? 'done' : ''));
            return '<div class="st ' + cls + '"><span class="c">' + s[0] + '</span>' + s[1] + '</div>';
          }).join('') + '</div>'
        : '';
      return '<div class="phase' + (isCur ? ' cur' : '') + (isCur && curAbn ? ' abn' : '') + '">' +
        '<div class="phasehead static">' + mk +
        '<span class="nm">' + p.name + '</span>' +
        '<span class="ct">' + (isDone ? normals.length : reached) + '/' + normals.length + '</span></div>' +
        body + '</div>';
    }).join('') + '</div>';

    '<div class="sechead"><h2>조립대 상태</h2><span class="note">배정 ' + assigned + ' · 미배정 ' + (list.length - assigned) + (helpCount ? ' · 도움 요청 ' + helpCount : '') + '</span></div>' +
    '<div class="cards3">' + cards + '</div></div>';
}

/* ===================== 탭 3: 창고 재고 ===================== */
function cartTile(letter, ck){
  var key = letter + '_' + ck, n = S.stock[key], max = keyMax(key);
  if(n === undefined){
    return '<button class="cart unk" data-act="refill-cart" data-key="' + key + '" type="button">' +
      '<div class="cid"><span class="sw" style="width:12px;height:12px;background:' + CHEX[ck] + '"></span><span class="cname">' + key + '</span></div>' +
      '<div class="cqty">—<s> / ' + max + '</s></div><div class="meter"><i style="width:0"></i></div></button>';
  }
  var cls = n === 0 ? 'out' : (n <= LOW_AT ? 'low' : '');
  return '<button class="cart ' + cls + '" data-act="refill-cart" data-key="' + key + '" type="button">' +
    '<div class="cid"><span class="sw" style="width:12px;height:12px;background:' + CHEX[ck] + '"></span><span class="cname">' + key + '</span></div>' +
    '<div class="cqty">' + n + '<s> / ' + max + '</s></div>' +
    '<div class="meter"><i style="width:' + Math.min(100, Math.round(n / max * 100)) + '%"></i></div></button>';
}
function viewStock(){
  var out = outCarts(), low = lowCarts();
  var missing = COLORS.filter(function(c){ return S.board[c] === 0; });

  var zoneCards = ZONES.map(function(z){
    var tiles = z.letters.map(function(l){ return COLORS.map(function(c){ return cartTile(l, c); }).join(''); }).join('');
    var zl = 0, zm = 0;
    z.letters.forEach(function(l){ COLORS.forEach(function(c){ zl += S.stock[l + '_' + c] || 0; zm += keyMax(l + '_' + c); }); });
    return '<div class="card zonecard">' +
      '<div class="zonehead"><span class="z">구역 ' + z.no + '</span><span class="l">' + z.letters.join(' / ') + '</span>' +
      '<span class="b">' + z.shelf + ' · ' + zl + '/' + zm + '</span></div>' +
      '<div class="cartgrid">' + tiles + '</div></div>';
  }).join('');

  var boardRows = COLORS.map(function(c){
    var n = S.board[c], max = boardMax(c), known = n !== undefined;
    return '<div class="boardrow">' +
      '<span class="sw" style="width:16px;height:16px;background:' + CHEX[c] + '"></span>' +
      '<span style="font-size:12.5px;font-weight:500">보드 · ' + CNAME[c] + ' <span class="mono" style="color:var(--faint);font-size:11px">' + c + '</span></span>' +
      '<span class="num" style="text-align:right;color:' + (n ? 'var(--ink)' : 'var(--danger-btn-fg)') + '">' + (known ? n + ' / ' + max : '—') + '</span>' +
      '<button class="btn sm" data-act="load-board" data-color="' + c + '" type="button"' + (known && n >= max ? ' disabled' : '') + '>채우기</button></div>';
  }).join('');

  return '<div class="wrap narrow">' + errBox(['stock']) +
    (out.length || low.length
      ? '<div class="alert"><div class="t"><span>⚠</span>키캡 카트리지 · 소진 ' + out.length + ' · 부족 ' + low.length + '</div><div class="tags">' +
        out.map(function(k){ return '<span class="tag">' + k + ' · 소진</span>'; }).join('') +
        low.map(function(k){ return '<span class="tag n">' + k + ' · ' + S.stock[k] + '개</span>'; }).join('') + '</div></div>'
      : '') +
    (missing.length
      ? '<div class="alert warn"><div class="t"><span>⚠</span>보드 소진 · ' + missing.map(function(c){ return CNAME[c]; }).join(', ') + '</div>' +
        '<div style="font-size:12px;color:var(--warn-ink)">해당 색상 보드를 쓰는 주문은 배정되지 않고 대기열에서 기다립니다.</div></div>'
      : '') +
    '<div class="sechead"><h2>보드 보관대</h2><span class="note">색상 4칸 · 칸당 최대 ' + boardMax('r') + '장 (현재 ' + boardTotal() + '/' + boardCap() + ')</span></div>' +
    '<div class="card rack">' + boardRows + '</div>' +
    '<div class="sechead" style="margin-top:6px"><h2>키캡 카트리지</h2><span class="note">MBTI 글자 8종 × 색상 4종 = 32 · 카트리지당 최대 ' + keyMax('E_r') + '개 · ' + LOW_AT + '개 이하 부족</span></div>' +
    '<div class="toolbar"><button class="btn primary" data-act="refill-low" type="button"' + (out.length + low.length ? '' : ' disabled') + '>부족·소진 카트리지 일괄 교체</button>' +
      '<span style="font-size:12px;color:var(--muted)">카트리지를 누르면 교체 확인 창이 열립니다. 고장(disable) 칸은 채워도 풀리지 않습니다 — fault 해제로 풉니다.</span></div>' +
    '<div class="zonegrid">' + zoneCards + '</div>' +
    '<div class="card" style="padding:14px 15px;display:flex;flex-direction:column;gap:6px">' +
      '<div style="font-size:12.5px;font-weight:600;color:var(--slate)">이 화면에서 한 교체 내역 <span class="muted" style="font-weight:400">(새로고침하면 사라짐)</span></div>' +
      (S.log.length
        ? S.log.map(function(e){ return '<div class="logrow"><span class="mono" style="color:var(--faint)">' + e.time + '</span><span>' + esc(e.text) + '</span></div>'; }).join('')
        : '<div style="font-size:12px;color:var(--faint)">아직 교체 내역이 없습니다.</div>') +
    '</div></div>';
}

/* ===================== 탭 4: 창고 상태 ===================== */
function partEl(id, inner, cls){
  var bad = faultsOf(id).length > 0;
  return '<button class="part ' + (cls || '') + (bad ? ' bad' : '') + '" data-part="' + id + '" data-act="locate-part" type="button">' + inner(bad) + '</button>';
}
function zoneInner(z){
  return function(bad){
    var rows = z.letters.map(function(l){
      var pips = COLORS.map(function(c){
        var key = l + '_' + c, n = S.stock[key];
        var k = n === 0 ? ' out' : (n !== undefined && n <= LOW_AT ? ' low' : '');

      }).join('');
      return '<div class="piprow"><span class="lt">' + l + '</span>' + pips + '</div>';
    }).join('');
    return '<div class="ptop"><div><div class="pid">' + z.id + ' · ' + z.shelf + '</div><div class="pname">구역 ' + z.no + ' · ' + z.letters.join('/') + '</div></div>' +

  };
}
function beltInner(id, name){

}

/* ===================== locate ===================== */
function locate(pid){
  [].slice.call(document.querySelectorAll('[data-part="' + pid + '"],[data-fault-part="' + pid + '"]')).forEach(function(el){
    el.classList.remove('is-locating');
    void el.offsetWidth;
    el.classList.add('is-locating');
    setTimeout(function(){ el.classList.remove('is-locating'); }, 1700);
  });
  var first = document.querySelector('[data-part="' + pid + '"]');
  if(first && first.scrollIntoView) first.scrollIntoView({block:'nearest', inline:'nearest', behavior:'smooth'});
}

/* ===================== 확인 창 ===================== */
/* d: {title, body(html), kv, ok, tone, pw, discard, info, run: async(vals) → 다음 확인 창(선택)} */
function ask(d){
  d.err = null; d.busy = false;
  if(d.pw) d.pwValue = ADMIN_PW || '';
  S.dialog = d;
  renderOverlay();
}
function info(title, body, kv){ ask({info:true, title:title, body:body, kv:kv, ok:'확인'}); }

async function confirmDialog(){
  var d = S.dialog;
  if(!d || d.busy) return;
  if(d.info || !d.run){ S.dialog = null; renderOverlay(); return; }
  var vals = {};
  if(d.pw){
    var el = document.getElementById('dlgPw');
    d.pwValue = el ? el.value : '';
    if(!d.pwValue){ d.err = '비밀번호를 입력하세요'; renderOverlay(); return; }
    vals.password = d.pwValue;
  }
  if(d.discard){
    var ch = document.querySelector('input[name="dlgDiscard"]:checked');
    d.discardValue = !ch || ch.value === '1';
    vals.discard = d.discardValue;
  }
  d.busy = true; d.err = null; renderOverlay();
  try {
    var next = await d.run(vals);
    if(d.pw) ADMIN_PW = d.pwValue;
    if(S.dialog === d) S.dialog = null;
    if(next) ask(next); else renderOverlay();
    renderHeader(); renderMain();
    refresh(2);
  } catch(e){
    d.busy = false;
    d.err = e.message;
    if(e.status === 400 && /비밀번호/.test(e.message)) d.pwValue = '';
    renderOverlay();
  }
}

function faultDialog(f, lead){
  var def = faultDef(f.code), pid = partOf(f);
  var warn = (f.stage === 'assigned' || f.stage === 'keycap_mismatched')
    ? '<br><br>해제하면 출고 지시 마감(60초)이 다시 걸립니다. 창고가 그 안에 재배출을 시작하지 않으면 <b>stage_timeout</b>이 다시 붙습니다.' : '';
  return {
    title: 'fault 해제 · 대기번호 ' + f.wait,
    body: (lead ? lead + '<br><br>' : '') + '현장 조치를 마쳤나요? 해제하면 단계(<b>' + esc(stageLabel(f.stage)) + '</b>)는 그대로 두고 그 자리에서 이어갑니다. fault가 빠진 공정 스냅샷이 나가면 ' + esc(def.actor) + ' 쪽이 다시 진행합니다.' + warn,
    kv: [['fault', f.code], ['위치', PARTS[pid].name + (f.target ? ' · ' + f.target : '')], ['대기번호', f.wait], ['멈춘 단계', stageLabel(f.stage)], ['조치', def.fix]],
    ok: 'fault 해제', tone: 'danger', pw: true,
    run: async function(v){
      var r = await api('POST', '/admin/order/' + encodeURIComponent(f.id) + '/fault/clear', {password: v.password});
      say(r.cleared + ' 해제 · ' + stageLabel(r.stage) + '에서 이어감');
    }
  };
}

/* 이 주문만 중단 — 조립대 초기화 · 주문 상세 · fault 행에서 같이 쓴다 */
function abortDialog(o){   /* o: {id, seq, stage, sid} */
  var st = o.stage, body, discard = false;
  if(st === 'queued') body = '대기열에서 빼고 끝냅니다.';
  else if(WAREHOUSE_STAGES.indexOf(st) >= 0) body = '<b>벨트 위 트레이·부품을 먼저 치웠나요?</b> 창고가 풀리면 바로 다음 주문이 배정돼 벨트가 다시 돕니다.';
  else if(st === 'pickup_reached') body = '픽업대에 있는 트레이는 사람이 회수해야 합니다.';
  else if(st === 'loaded' || st === 'arrived'){ body = 'AGV가 싣고 있는 트레이를 어떻게 처리할지 고르세요.'; discard = true; }
  else if(st === 'verified' || st === 'received') body = '손님 앞에 있는 주문입니다. 완료로 끝냅니다.';
  else if(st === 'unclaimed') body = '폐기 보고를 기다리지 않고 조립대를 강제로 풉니다.';
  else body = '이 주문만 끝냅니다.';
  var seq = o.seq != null ? String(o.seq) : '-';
  ask({
    title: '주문 중단 · 대기번호 ' + seq,
    body: body + ' 다른 주문은 건드리지 않고, 완료 통계에서는 빠집니다 (reason=admin_abort).',
    kv: [['주문번호', o.id], ['단계', stageLabel(st)], ['조립대', o.sid ? stNo(o.sid) : '배정 전']],
    ok: '주문 중단', tone: 'danger', pw: true, discard: discard, discardValue: true,
    run: async function(v){
      var payload = {password: v.password};
      if(discard) payload.discard = v.discard !== false;
      var r = await api('POST', '/admin/order/' + encodeURIComponent(o.id) + '/abort', payload);
      var kv = [['이전 단계', stageLabel(r.from_stage)], ['최종 단계', stageLabel(r.final_stage)]];
      if(r.fault) kv.push(['남아 있던 fault', r.fault]);
      if(r.assigned_next && r.assigned_next.length) kv.push(['새로 배정', r.assigned_next.join(', ')]);
      return {info:true, title:'중단 완료 · 대기번호 ' + seq, body: esc(r.action || '처리되었습니다.'), kv:kv, ok:'확인'};
    }
  });
}

/* 방금 채운 칸 때문에 멈춘 주문 → fault 해제 확인 창으로 이어간다 */
function followUpFault(slots){
  var f = S.faults.filter(function(x){
    return (x.code === 'keycap_empty' || x.code === 'board_empty') && slots.indexOf(x.target) >= 0;
  })[0];
  return f ? faultDialog(f, '<b>방금 채운 칸(' + esc(f.target) + ') 때문에 멈춘 주문이 있습니다.</b> 재고를 채워도 fault는 남아 있어서 해제해야 이어집니다.') : null;
}

var ASK = {
  resolveHelp: function(sid){
    var c = S.calls[sid];
    if(!c){ say('호출 중이 아닙니다'); return; }
    ask({title: '조립대 ' + stNo(sid) + ' 호출 해결',
      body: '현장 응대를 마쳤나요? 해결하면 호출 표시가 내려가고, 진행 중 주문은 지금부터 기본 마감을 다시 잽니다.',
      kv: [['조립대', stNo(sid)], ['대기번호', c.order_seq != null ? String(c.order_seq) : '주문 없음'], ['호출 시각', hhmm(c.called_at)], ['누른 횟수', (c.count || 1) + '회']],
      ok: '호출 해결', tone: 'danger',
      run: async function(){
        var r = await api('POST', '/admin/station/' + encodeURIComponent(sid) + '/call/ok');
        say('조립대 ' + stNo(sid) + ' 호출 해결 · ' + fmtSec(r.waited_sec) + ' 대기');
      }});
  },
  resetStation: function(sid){
    var s = S.stations.filter(function(x){ return x.sid === sid; })[0];
    if(!s || !s.order){ say('배정된 주문이 없습니다'); return; }
    abortDialog({id:s.order.order_id, seq:s.order.order_seq, stage:s.order.stage, sid:sid});
  },
  fillPaper: function(){
    var p = S.printer;
    ask({title: '영수증 용지 채우기 · 미연동',
      body: '키오스크 용지를 ' + p.cap + '매(가득)로 기록합니다. 서버에는 저장되지 않고 이 브라우저에만 남습니다.',
      kv: [['현재', p.qty + ' / ' + p.cap + '매'], ['교체 후', p.cap + ' / ' + p.cap + '매']],
      ok: '채우기 완료',
      run: async function(){
        var t = now();
        S.paperLog = [{time:t, text:p.name + ' 용지 채움 · ' + p.qty + ' → ' + p.cap + '매'}].concat(S.paperLog).slice(0, 8);
        S.printer = Object.assign({}, p, {qty:p.cap, lastAt:t});
        say('키오스크 용지 채움 (로컬 기록)');
      }});
  },
  resolveFault: function(id){
    var f = S.faults.filter(function(x){ return x.id === id; })[0];
    if(f) ask(faultDialog(f));
  },
  abortFault: function(id){
    var f = S.faults.filter(function(x){ return x.id === id; })[0];
    if(f) abortDialog({id:f.id, seq:f.seq, stage:f.stage, sid:f.sid});
  },
  abortOrder: function(no){
    var o = S.orders.filter(function(x){ return x.orderNo === no; })[0];
    if(o) abortDialog({id:o.orderNo, seq:o.seq, stage:o.stage, sid:o.sid});
  },
  refillCart: function(key){
    var n = S.stock[key], max = keyMax(key);
    if(n === undefined){ say(key + ' 재고 데이터가 아직 없습니다'); return; }
    if(n >= max){ say(key + ' 는 이미 가득 찼습니다'); return; }
    ask({title: '카트리지 교체 · ' + key,
      body: '카트리지를 가득(' + max + '개) 채운 것으로 기록합니다. 실제 교체를 완료했나요?',
      kv: [['카트리지', key], ['현재', n + ' / ' + max], ['교체 후', max + ' / ' + max]],
      ok: '교체 완료',
      run: async function(){
        var r = await api('POST', '/admin/stock/refill', {part:key, count:max});
        S.stock[key] = r.count;
        addLog(key + ' 카트리지 교체 · ' + n + ' → ' + r.count + '개' + (r.status === 'disable' ? ' (고장 상태 유지)' : ''));
        say(key + ' 교체 완료');
        return followUpFault([key]);
      }});
  },
  loadBoard: function(c){
    var n = S.board[c], max = boardMax(c);
    if(n === undefined){ say('보드 ' + CNAME[c] + ' 재고 데이터가 아직 없습니다'); return; }
    if(n >= max){ say('보드 ' + CNAME[c] + ' 는 이미 가득 찼습니다'); return; }
    ask({title: '보드 보관대 · ' + CNAME[c] + ' 채우기',
      body: CNAME[c] + ' 칸을 가득(' + max + '장) 채운 것으로 기록합니다. 실제로 넣었나요?',
      kv: [['칸', c], ['현재', n + ' / ' + max], ['채운 후', max + ' / ' + max]],
      ok: '채우기 완료',
      run: async function(){
        var r = await api('POST', '/admin/stock/refill', {part:c, count:max});
        S.board[c] = r.count;
        addLog('보드 ' + CNAME[c] + ' 채움 · ' + n + ' → ' + r.count + '장');
        say('보드 ' + CNAME[c] + ' 채우기 완료');
        return followUpFault([c]);
      }});
  },
  refillLow: function(){
    var targets = outCarts().concat(lowCarts());
    if(!targets.length){ say('부족한 카트리지가 없습니다'); return; }
    ask({title: '부족·소진 카트리지 일괄 교체',
      body: '아래 카트리지를 모두 가득 채운 것으로 기록합니다. 한 칸씩 차례로 보냅니다.',
      kv: targets.map(function(k){ return [k, S.stock[k] + ' → ' + keyMax(k)]; }),
      ok: targets.length + '개 교체 완료',
      run: async function(){
        var ok = [], fail = [];
        for(var i = 0; i < targets.length; i++){
          var k = targets[i];
          try { var r = await api('POST', '/admin/stock/refill', {part:k, count:keyMax(k)}); S.stock[k] = r.count; ok.push(k); }
          catch(e){ fail.push(k + ' (' + e.message + ')'); }
        }
        if(ok.length) addLog(ok.length + '개 카트리지 일괄 교체 · ' + ok.join(', '));
        if(fail.length) return {info:true, title:'일괄 교체 · 일부 실패', body:'성공 ' + ok.length + '개 · 실패 ' + fail.length + '개', kv:fail.map(function(x){ return ['실패', x]; }), ok:'확인'};
        say(ok.length + '개 카트리지 교체 완료');
        return followUpFault(ok);
      }});
  },
  line: function(next){
    var open = next === 'open';
    ask({title: open ? '주문 접수 시작' : '주문 접수 마감',
      body: open
        ? '키오스크가 새 주문을 받기 시작합니다. 리셋 뒤라면 스냅샷 확인(위반 0건)을 마쳤나요?'
        : '새 주문 접수만 막습니다. 대기열과 진행 중 주문은 끝까지 갑니다. 운영 탭에서 남은 주문이 0이 되고 AGV가 돌아오면 장비를 꺼도 됩니다.',
      kv: S.line ? [['현재', S.line.status === 'open' ? '접수 중' : '마감'], ['남은 주문', String(S.line.remaining)]] : null,
      ok: open ? '접수 시작' : '접수 마감', tone: open ? 'primary' : 'danger', pw: true,
      run: async function(v){
        var r = await api('POST', '/admin/line', {password:v.password, status:next});
        S.line = r;
        say(open ? '주문 접수 시작' : '주문 접수 마감');
      }});
  },
  reset: function(){
    var m = S.reset.mode;
    if(m === 'hard' && S.reset.confirm !== 'HARD-RESET'){ say('hard 는 확인 문구 HARD-RESET 을 정확히 입력해야 합니다'); return; }
    ask({title: '리셋 · ' + m,
      body: RESET_DESC[m][2] + ' 끝나면 영업 상태가 자동으로 <b>마감</b>이 됩니다.',
      kv: [['mode', m], ['대기열 보존', S.reset.keep_queue ? '예' : '아니오']],
      ok: '리셋 실행', tone: 'danger', pw: true,
      run: async function(v){
        var body = {password:v.password, mode:m, keep_queue:S.reset.keep_queue};
        if(m === 'hard') body.confirm = S.reset.confirm;
        var r = await api('POST', '/admin/reset', body);
        S.resetResult = {at:now(), mode:m, data:r};
        S.reset.confirm = '';
        say('리셋 완료 · 스냅샷 확인 뒤 접수를 시작하세요');
      }});
  }
};

async function runSnapshot(){
  if(S.snapBusy) return;
  S.snapBusy = true; renderMain();
  try { S.snap = {at:now(), data: await api('GET', '/admin/debug/snapshot' + (S.snapMobius ? '?mobius=1' : ''))}; }
  catch(e){ S.snap = {at:now(), error:e.message}; }
  S.snapBusy = false; renderMain();
}
function quick(method, path, okMsg){
  api(method, path).then(function(){ say(okMsg); }).catch(function(e){ say(e.message); }).then(function(){ refresh(2); });
}

/* ===================== 이벤트 ===================== */
document.addEventListener('click', function(ev){
  var t = ev.target.closest('[data-act]');
  if(!t || t.disabled) return;
  var act = t.getAttribute('data-act');
  var no = t.getAttribute('data-no');
  var sid = t.getAttribute('data-sid');

  if(act === 'tab'){ S.tab = t.getAttribute('data-v'); render(); document.getElementById('main').scrollTop = 0; refresh(0); return; }
  if(act === 'filter'){ S.filter = t.getAttribute('data-v'); render(); return; }
  if(act === 'line-chip'){ if(S.line) ASK.line(S.line.status === 'open' ? 'closed' : 'open'); return; }

  /* 주문 */
  if(act === 'toggle-sel'){
    ev.stopPropagation();
    S.sel = S.sel.indexOf(no) >= 0 ? S.sel.filter(function(x){ return x !== no; }) : S.sel.concat([no]);
    render(); return;
  }
  if(act === 'toggle-all'){
    ev.stopPropagation();
    var vis = visibleOrders().map(function(o){ return o.orderNo; });
    var all = vis.every(function(x){ return S.sel.indexOf(x) >= 0; });
    S.sel = all ? [] : vis;
    render(); return;
  }
  if(act === 'open-order'){
    if(S.detailId !== no){ S.detailEnter = !S.detailId; S.detailId = no; render(); }   /* 등장 효과는 패널이 닫혀 있다 열릴 때만 */
    return;
  }
  if(act === 'close-detail'){ S.detailId = null; render(); return; }
  if(act === 'receipt'){ ev.stopPropagation(); S.receiptId = no; renderOverlay(); return; }
  if(act === 'close-receipt'){ if(ev.target === t){ S.receiptId = null; renderOverlay(); } return; }
  if(act === 'abort-order'){ ASK.abortOrder(no); return; }

  /* 조립대 */
  if(act === 'resolve-help'){ ASK.resolveHelp(sid); return; }
  if(act === 'reset-station'){ ASK.resetStation(sid); return; }
  if(act === 'raise-help'){ quick('POST', '/admin/station/' + encodeURIComponent(sid) + '/call', '조립대 ' + stNo(sid) + ' 호출 발생(테스트)'); return; }

  /* 용지 */
  if(act === 'fill-paper'){ ASK.fillPaper(); return; }

  /* 창고 상태 */
  if(act === 'locate-part'){
    var pid = t.getAttribute('data-part'), n2 = faultsOf(pid).length;
    locate(pid);
    say(PARTS[pid].name + ' · ' + (n2 ? '활성 fault ' + n2 + '건' : '활성 fault 없음'));
    return;
  }
  if(act === 'locate-row'){
    var row = t.closest('[data-fault-part]');
    if(row) locate(row.getAttribute('data-fault-part'));
    return;
  }
  if(act === 'resolve-fault'){ ev.stopPropagation(); ASK.resolveFault(t.getAttribute('data-fault')); return; }
  if(act === 'abort-fault'){ ev.stopPropagation(); ASK.abortFault(t.getAttribute('data-fault')); return; }

  /* 재고 */
  if(act === 'refill-cart'){ ASK.refillCart(t.getAttribute('data-key')); return; }
  if(act === 'load-board'){ ASK.loadBoard(t.getAttribute('data-color')); return; }
  if(act === 'refill-low'){ ASK.refillLow(); return; }

  /* 운영 */
  if(act === 'line-set'){ ASK.line(t.getAttribute('data-v')); return; }
  if(act === 'reset-run'){ ASK.reset(); return; }
  if(act === 'snap-run'){ runSnapshot(); return; }
  if(act === 'pw-forget'){ ADMIN_PW = null; say('기억한 비밀번호를 지웠습니다'); renderMain(); return; }

  /* 확인 창 */
  if(act === 'dialog-cancel'){ if(!S.dialog || !S.dialog.busy){ S.dialog = null; renderOverlay(); } return; }
  if(act === 'dialog-scrim'){ if(ev.target === t && S.dialog && !S.dialog.busy){ S.dialog = null; renderOverlay(); } return; }
  if(act === 'dialog-ok'){ confirmDialog(); return; }
}, false);

document.addEventListener('change', function(ev){
  var act = ev.target && ev.target.getAttribute && ev.target.getAttribute('data-act');
  if(act === 'reset-mode'){ S.reset.mode = ev.target.value; S.reset.confirm = ''; renderMain(); }
  if(act === 'reset-keep'){ S.reset.keep_queue = ev.target.checked; }
  if(act === 'snap-mobius'){ S.snapMobius = ev.target.checked; }
}, false);
document.addEventListener('input', function(ev){
  var act = ev.target && ev.target.getAttribute && ev.target.getAttribute('data-act');
  if(act === 'query'){ S.query = ev.target.value; renderMain(); }
  if(act === 'reset-confirm'){ S.reset.confirm = ev.target.value; }
}, false);
document.addEventListener('keydown', function(ev){
  if(ev.key === 'Enter' && ev.target && ev.target.id === 'dlgPw'){ ev.preventDefault(); confirmDialog(); return; }
  if(ev.key !== 'Escape') return;
  if(S.dialog){ if(!S.dialog.busy){ S.dialog = null; renderOverlay(); } return; }
  if(S.receiptId){ S.receiptId = null; renderOverlay(); return; }
  if(S.detailId){ S.detailId = null; render(); }
}, false);

/* ===================== 시작 ===================== */
function clockTick(){ document.getElementById('clock').textContent = now(); }
clockTick(); setInterval(clockTick, 10000);
render();
refresh(2);
setInterval(function(){
  if(document.hidden) return;
  var t = Date.now(), slack = 500;
  refresh(t - lastAllAt >= POLL_ALL_MS - slack ? 2 : (t - lastHeaderAt >= POLL_HEADER_MS - slack ? 1 : 0));
}, POLL_TAB_MS);
/* 다른 탭에 있다 돌아왔을 때 오래됐으면 한 번 갱신 */
document.addEventListener('visibilitychange', function(){
  if(!document.hidden && Date.now() - lastAnyAt >= POLL_TAB_MS) refresh(1);
});
})();
</script>
